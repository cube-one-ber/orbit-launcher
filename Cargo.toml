[package]
name = "orbit-launcher"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "A customizable Rust and Kirigami game launcher"

[features]
default = ["gui"]
gui = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
url = "2"
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico", "gif"] }
sha2 = "0.10"
cxx = { version = "1", optional = true }
cxx-qt = { version = "0.10", optional = true }
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"], optional = true }

[build-dependencies]
cxx-qt-build = { version = "0.10", optional = true }

[[bin]]
name = "orbit"
path = "src/main.rs"
required-features = ["gui"]

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
