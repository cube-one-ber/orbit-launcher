name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each pushed commit gets a build/release, even if a newer commit arrives.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: '6.8.3'
  KDE_VERSION: '6.13.0'

jobs:
  browser-extension:
    name: Roblox browser sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test browser-extension/roblox/tests/sync.test.cjs
      - name: Package both browser variants
        run: python scripts/package-roblox-extension.py target/artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-roblox-browser-extension
          path: target/artifacts/orbit-roblox-*.zip
          if-no-files-found: error

  format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - name: Check packaging and release tooling
        run: python -m unittest discover -s scripts/tests -v

  build:
    name: Build / ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            qt-arch: linux_gcc_64
          - os: windows-2022
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            qt-arch: win64_msvc2022_64
          - os: macos-15-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
            qt-arch: clang_64
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            qt-arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-qt-${{ env.QT_VERSION }}
      - name: Test the Rust core
        run: cargo test --locked --no-default-features --target ${{ matrix.target }}
      - name: Lint the Rust core
        run: cargo clippy --locked --no-default-features --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Activate MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build lld patchelf libgl1-mesa-dev \
            libxkbcommon-dev libegl1-mesa-dev libfontconfig1-dev libxcb-cursor0
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt-arch }}
          # Qt SVG is included in the base desktop SDK.
          modules: qtshadertools
          cache: true
      - name: Cache Kirigami
        uses: actions/cache@v4
        with:
          path: target/ci-deps
          key: kirigami-v1-${{ matrix.os }}-${{ matrix.target }}-qt-${{ env.QT_VERSION }}-kde-${{ env.KDE_VERSION }}
      - name: Cache third-party license sources
        uses: actions/cache@v4
        with:
          path: target/ci-license-sources
          key: runtime-licenses-v1-qt-${{ env.QT_VERSION }}-kde-${{ env.KDE_VERSION }}
      - name: Build Kirigami and configure Qt paths
        run: python scripts/ci-dependencies.py
      - name: Build the release application
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Check the release UI
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          ./scripts/check-ui.ps1 -Executable "target/${{ matrix.target }}/release/orbit$extension"
      - name: Package the application and its runtime
        run: python scripts/ci-archive.py ${{ matrix.target }} ${{ matrix.platform }}
      - name: Upload the runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.platform }}
          path: target/artifacts/*
          if-no-files-found: error
          retention-days: 14

  verify-package:
    name: Verify package / ${{ matrix.platform }}
    needs: build
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            archive: orbit-linux-x86_64.tar.gz
          - os: windows-2022
            platform: windows-x86_64
            archive: orbit-windows-x86_64.zip
          - os: macos-15-intel
            platform: macos-x86_64
            archive: orbit-macos-x86_64.tar.gz
          - os: macos-15
            platform: macos-arm64
            archive: orbit-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: orbit-${{ matrix.platform }}
          path: target/download
      - name: Install Linux display driver and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgl1 libegl1
      # Deliberately no Rust, Qt, Kirigami, Craft, or MSVC setup in these jobs.
      - name: Test the relocated archive with isolated runtime paths
        run: python scripts/check-package.py ${{ matrix.platform }} target/download/${{ matrix.archive }}

  prerelease:
    name: Publish commit prerelease
    if: github.event_name != 'pull_request'
    needs: [format, browser-extension, verify-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: orbit-*
          merge-multiple: true
          path: target/prerelease
      - name: Publish validated packages and SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-prerelease.py target/prerelease
